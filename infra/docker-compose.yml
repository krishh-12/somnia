services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: somnia
      POSTGRES_PASSWORD: somnia
      POSTGRES_DB: somnia
    volumes:
      - somnia2_pg:/var/lib/postgresql/data
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://somnia:somnia@db:5432/somnia
      VULTR_INFERENCE_MODEL: ${VULTR_INFERENCE_MODEL:-qwen3.8-flash-next}
    depends_on:
      - db
  caddy:
    image: caddy:2.11-alpine
    ports:
      - "8090:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api

volumes:
  somnia2_pg:
