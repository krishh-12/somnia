[project]
name = "somnia2"
version = "0.1.0"
description = "Somnia hackathon API: ingestion, anomaly scoring, alarms, and review"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "numpy>=2.1",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "scikit-learn>=1.5",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["somnia*"]
